name: Weekly DB backup
on:
  schedule:
    - cron: '43 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump database
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # The repo is public, so artifacts are downloadable by anyone: ALWAYS encrypt.
      - name: Encrypt dump
        run: gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o backup.sql.gpg backup.sql
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gpg
          retention-days: 90
